# Workspace Manager Configuration

# Workspace 1: code
[workspace_1]
layout = tabbed

[workspace_1_window_1]
command = kitty
match = app_id="kitty"
focus = true
post_command = send_text=tmux\n

[workspace_1_window_2]
command = zen-browser --new-window "https://claude.ai"
match = app_id="zen"

# Workspace 6: home
[workspace_6]
layout = splitv

[workspace_6_window_1]
command = zen-browser --new-window "https://youtube.com"
match = app_id="zen"
mark = zen-youtube

[workspace_6_window_2]
command = plexamp
match = class="Plexamp"
position = resize set height 15 ppt, move up
